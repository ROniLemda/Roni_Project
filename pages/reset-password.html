<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../pages/style.css">
  <title>חתימה+ | איפוס סיסמא</title>
</head>
<body>

  <div class="login-cntainer"> 
    <!-- החצי השמאלי עם תמונת הרקע -->
    <div class="left-side"></div>

    <!-- החצי הימני עם הטופס -->
    <div class="right-side">
      <div class="login-box">
        
        <!-- לוגו החברה הכחול -->
        <div class="login-logo">
          <img src="../images/logo.png" alt="חתימה+ לוגו">
        </div>

        <div class="reset-panel" id="resetPanel"> <!-- פותח את קופסת האימייל -->

          <h2>Reset Password</h2>
          <p class="login-desc">Enter your email to receive a password reset link.</p>

          <!-- טופס איפוס סיסמה -->
          <form id="resetForm">
            <div class="form-box">
              <label for="resetUsername">Username</label>
              <input type="text" id="resetUsername" required placeholder="your_username">
            </div>

            <div class="form-box">
              <label for="resetEmail">Email Address</label>
              <input type="email" id="resetEmail" required placeholder="name@company.com">
            </div>
            <button type="submit" class="login-button">Send Reset Link</button>
          </form>

          <!-- קישור חזרה לדף ההתחברות -->
          <div class="options-box">
            <a href="login.html" class="back-login-btn">
              <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
          </div>

        </div> <!-- סגירה של reset-panel -->

        <div class="verify-panel" id="verifyPanel" style="display: none;"> <!-- פותח את קופסת הקוד - מוסתרת בהתחלה -->

          <h2>Verify Code</h2>
          <p class="login-desc">Enter the 6-digit code sent to your email</p>

          <form id="verifyForm"> <!-- פותח את הטופס של בדיקת הקוד -->
            <div class="otp-container"> <!-- קופסה שמחזיקה את שורת הריבועים -->
              <input type="text" maxlength="1" class="otp-input" required> <!-- ספרה 1 -->
              <input type="text" maxlength="1" class="otp-input" required> <!-- ספרה 2 -->
              <input type="text" maxlength="1" class="otp-input" required> <!-- ספרה 3 -->
              <input type="text" maxlength="1" class="otp-input" required> <!-- ספרה 4 -->
              <input type="text" maxlength="1" class="otp-input" required> <!-- ספרה 5 -->
              <input type="text" maxlength="1" class="otp-input" required> <!-- ספרה 6 -->
            </div> <!-- סגירה של otp-container -->

            <button type="submit" class="login-button">Verify Code</button> <!-- כפתור אימות -->

            <div class="resend-box"> <!-- קופסה לשורת השליחה החוזרת -->
              <p class="resend-text">Didn't receive code? <a href="#" class="resend-link">Resend</a></p>

      <div class="change-email-box">
     <button type="button" id="backToEmailBtn" class="change-email-btn">
     <i class="fa-solid fa-arrow-left"></i> Change Email
      </button>
            </div> <!-- סגירה של resend-box -->

          </form> <!-- סגירה של verifyForm -->

        </div> <!-- סגירה של verify-panel -->
      </div> <!-- סגירה של הריבוע הלבן -->
    </div> <!-- סגירה של צד ימין -->
  </div> <!-- סגירה של הריבוע שמכליל את הכל-->
<script>
  // מעבר לדף הזנת קוד אימות לאחר הזנת מייל בשכחתי סיסמא 
const resetForm = document.getElementById('resetForm'); // תופס את טופס האימייל
const resetPanel = document.getElementById('resetPanel'); // תופס את הקוספא המלאה של כל חלק האימייל
const verifyPanel = document.getElementById('verifyPanel'); // תופס את הקופסה של ה-6 ספרות

resetForm.onsubmit = function(e)  /* האות אי מחזיקה את כל המידע על הלחיצה שהמשתמש עשה עכשיו */
{
    e.preventDefault(); /* מבטל את הרענון שהדפדפן עושה מהדיפולט בלחיצה על הכפתור */
    resetPanel.style.display = 'none'; // מעלים את החלק של האימייל
    verifyPanel.style.display = 'flex'; // מציג את החלק של ה-6 ספרות
};

// סיום מעבר מהזנת מייל לקוד אימות

// קפיצה אוטומטית בין ריבועי הקוד
const boxes = document.querySelectorAll('.otp-input'); // תופס את כל 6 הריבועים

// * פוקוס מעביר את הסימן של המקלדת אוטומטית לתיבה הבאה */
boxes[0].oninput = function() { boxes[1].focus(); } // ספרה 1 קופץ ל-2
boxes[1].oninput = function() { boxes[2].focus(); } // ספרה 2 קופץ ל-3
boxes[2].oninput = function() { boxes[3].focus(); } // ספרה 3 קופץ ל-4
boxes[3].oninput = function() { boxes[4].focus(); } // ספרה 4 קופץ ל-5
boxes[4].oninput = function() { boxes[5].focus(); } // ספרה 5 קופץ ל-6

// סיום קפיצה אוטומטית בריבועי הקוד
</script>
</body>
</html>
