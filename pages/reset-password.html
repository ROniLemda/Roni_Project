<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../pages/style.css">
  <script src="auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>חתימה+ | איפוס סיסמא</title>
</head>
<body>

  <div class="login-cntainer"> 
    <!-- החצי השמאלי עם תמונת הרקע -->
    <div class="left-side"></div>

    <!-- החצי הימני עם הטופס -->
    <div class="right-side">
      <div class="login-box">
        
        <!-- לוגו החברה הכחול -->
        <div class="login-logo">
          <img src="../images/logo.png" alt="חתימה+ לוגו">
        </div>

        <div class="reset-panel" id="resetPanel"> <!-- פותח את קופסת האימייל -->

          <h2>Reset Password</h2>
          <p class="login-desc">Enter your email to receive a password reset link.</p>

          <!-- טופס איפוס סיסמה -->
          <form id="resetForm" novalidate>
            <div class="form-box">
              <label for="resetUsername">Username</label>
              <input type="text" id="resetUsername" placeholder="username">
              <span class="error-msg" id="resetUserError"></span>
            </div>

            <div class="form-box">
              <label for="resetEmail">Email Address</label>
              <input type="email" id="resetEmail" placeholder="name@company.com">
              <span class="error-msg" id="resetEmailError"></span>
            </div>
            <button type="submit" class="login-button">Send Reset Link</button>
          </form>

          <!-- קישור חזרה לדף ההתחברות -->
          <div class="options-box">
            <a href="login.html" class="back-login-btn">
              <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
          </div>

        </div> <!-- סגירה של reset-panel -->
      </div> <!-- סגירה של הריבוע הלבן -->
    </div> <!-- סגירה של צד ימין -->
  </div> <!-- סגירה של הריבוע שמכליל את הכל-->

<script>
// הדפסה למסך הודעת שגיאה בעת איפוס
const resetForm = document.getElementById('resetForm');
const resetUser = document.getElementById('resetUsername'); // שדה שם המשתמש
const resetEmail = document.getElementById('resetEmail'); // שדה האימייל
const resetUserError = document.getElementById('resetUserError'); // מקום שגיאת שם משתמש
const resetEmailError = document.getElementById('resetEmailError'); // מקום שגיאת אימייל

resetForm.onsubmit = async function(e) 
{
    e.preventDefault(); // עוצר רענון דף
    let hasError = false; // בהתחלה אין שגיאות

    // ניקוי שגיאות ישנות ומסגרות אדומות
    resetUserError.textContent = '';
    resetEmailError.textContent = '';
    resetUser.classList.remove('input-error');
    resetEmail.classList.remove('input-error');

    // בדיקת שם משתמש
    const userErr = Auth.checkUsername(resetUser.value);
    if (userErr !== '') 
    {
        resetUserError.textContent = userErr;
        resetUser.classList.add('input-error');
        hasError = true;
    }

    // בדיקת אימייל  
    const emailErr = Auth.checkEmail(resetEmail.value);
    if (emailErr !== '') 
    {
        resetEmailError.textContent = emailErr;
        resetEmail.classList.add('input-error');
        hasError = true;
    }

    // אם יש שגיאה עוצר 
    if (hasError === true) 
    {
        return;
    }  

    // אריזת הנתונים מהשדות לחבילה מסודרת
    const resetData = 
    {
     username: resetUser.value, // שולף את שם המשתמש שהוקלד
     email: resetEmail.value    // שולף את האימייל שהוקלד
    };

    // שליחת בקשה לשרת לבדיקה האם המשתמש קיים במערכת
    const response = await fetch(API_URL + '/api/check-reset', 
    {
     method: 'POST',
     headers: { 'Content-Type': 'application/json' },
     body: JSON.stringify(resetData) // הופך את החבילה למחרוזת JSON
    });

    // קבלת הודעת התשובה מהשרת והצגתה למשתמש
    const result = await response.text();

    // אם המשתמש לא נמצא במסד הנתונים מציגים שגיאה באדום
    if (result.includes('אינם תואמים')) 
    {
        Swal.fire({
            icon: 'error',
            text: result,
            confirmButtonText: 'סגירה',
            confirmButtonColor: '#0052cc'
        });
        return;
    }

    // הכל תקין - מציגים הודעת הצלחה ומעבירים לדף האימות
    await Swal.fire({
        icon: 'success',
        text: result,
        confirmButtonText: 'המשך לאימות',
        confirmButtonColor: '#0052cc'
    });

    // מעביר לדף האימות עם פתק איפוס סיסמה
    window.location.href = 'verify.html?type=reset&email=' + resetEmail.value;
};
</script>
</body>
</html>
