<script>

// סיום קטע המעבר מהתחברות להרשמה


// הדפסה למסך הודעת שגיאה בהתחברות
const loginEmail = document.getElementById('loginEmail'); // שדה האימייל
const loginPassword = document.getElementById('loginPassword'); // שדה הסיסמה
const loginEmailError = document.getElementById('loginEmailError'); // המקום של הודעת השגיאה באימייל
const loginPassError = document.getElementById('loginPassError');  // המקום של הודעת השגיאה בסיסמא
const loginForm = document.getElementById('loginForm'); // טופס ופרטי ההתחברות
loginForm.onsubmit = async function(e) 
{
   e.preventDefault(); // עוצר את הרענון האוטומטי של הדף בלחיצה
   
   // 1. מנקה הודעות שגיאה ומוריד את הצבע האדום מהשדות
   loginEmailError.textContent = '';
   loginPassError.textContent = '';
   loginEmail.classList.remove('input-error');
   loginPassword.classList.remove('input-error');

    let hasError = false; // דגל שגיאה

    // 2. בדיקת אימייל או שם משתמש
    const emailError = Auth.checkLoginUser(loginEmail.value);
    if (emailError !== '') 
    {
        loginEmailError.textContent = emailError;
        loginEmail.classList.add('input-error'); // צובע את שדה האימייל באדום
        hasError = true;
    }

    // 3. בדיקת סיסמה
    const passError = Auth.checkPassword(loginPassword.value);
    if (passError !== '') 
    {
        loginPassError.textContent = passError;
        loginPassword.classList.add('input-error'); // צובע את שדה הסיסמה באדום
        hasError = true;
    }

    // אם יש שגיאה עוצר ולא שולח
    if (hasError === true)
    {
        return;
    }

    const captchaResult = await Swal.fire({
        title: 'תהליך אימות ואבטחה',
        text: 'אנא אשר שאינך רובוט להמשך תהליך ההתחברות',
        html: '<div id="recaptchaContainer" style="display: flex; justify-content: center; margin-top: 15px;"></div>',
        showCancelButton: true,
        cancelButtonText: 'ביטול',
        confirmButtonText: 'אימות והמשך',
        confirmButtonColor: '#0052cc',
        
        didOpen: function() 
        {
            // פקודה שאומרת לספרייה של גוגל לצייר את הריבוע של "אני לא רובוט"
            grecaptcha.render('recaptchaContainer', {
                'sitekey': '6LcYwtwtAAAAAAhXegnxfU7xOocojmQfsBqjZAyY' // מפתח האתר הרשמי שלך
            });
        },

        preConfirm: function()  // מבצע כמה דברים לפני שממשיכים
        {
            // שולפים את הטוקן שגוגל מייצרת כשמסמנים את הריבוע
            const captchaToken = grecaptcha.getResponse();
            
            // אם הטוקן ריק (הוא לא סימן את הריבוע)
            if (captchaToken == false) 
            {
                Swal.showValidationMessage('אימות האבטחה של reCAPTCHA נכשל נא אשר שאינך רובוט ונסה שנית.');
                return false; // עוצר את החלון ולא נותן לו להיסגר!
            }
            return captchaToken;
        }
    });

    // אם המשתמש לחץ על כפתור ביטול עוצרים מיד ולא שולחים לשרת
    if (captchaResult.isConfirmed === false) 
    {
        return;
    }

    // טיפול בזכור אותי אם מסומן שומרים, אם לא מוחקים מהזיכרון
    const rememberMe = document.getElementById('rememberMe');
    if (rememberMe.checked === true)  // מסומן
    {
        localStorage.setItem('rememberedUser', loginEmail.value); // שומר את המייל
    }
    else 
    {
        localStorage.removeItem('rememberedUser'); // מסיר את המייל
    }

    // אריזת פרטי ההתחברות לחבילה
    const loginData = 
    {
        email: loginEmail.value,
        password: loginPassword.value,
        captchaToken: captchaResult.value
    };

   // שליחה לשרת לנתיב /api/login
   const response = await fetch(API_URL + '/api/login',
  {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(loginData)
  });

  // קבלת התשובה מהשרת והצגתה
  const result = await response.text();
  if (result.includes('בהצלחה') || result.includes('קוד אימות'))
  {
      await Swal.fire({
          icon: 'success',
          text: result,
          confirmButtonText: 'המשך לתהליך האימות',
          confirmButtonColor: '#0052cc'
      });

      // מעבירים לדף הזנת הקוד עם ציון סוג הפעולה כהתחברות
      window.location.href = 'verify.html?type=login&email=' + loginEmail.value;
  }
  else
  {
      Swal.fire({
          icon: 'error',
          text: result,
          confirmButtonText: 'סגירה',
          confirmButtonColor: '#0052cc'
      });
  }
}

// הדפסה למסך הודעת שגיאה בעת הרשמה
const signupForm = document.getElementById('signupForm'); //  טופס ההרשמה ופרטי התחברות
signupForm.onsubmit = async function(e) 
{
    e.preventDefault(); // עוצר רענון אוטומטי של הדף

    // מנקה את כל השגיאות הישנות
    document.getElementById('signupNameError').textContent = '';
    document.getElementById('signupUserError').textContent = '';
    document.getElementById('signupEmailError').textContent = '';
    document.getElementById('signupPassError').textContent = '';
    document.getElementById('signupTermsError').textContent = '';

    const nameInput = document.getElementById('signupName');
    const userInput = document.getElementById('signupUsername');
    const emailInput = document.getElementById('signupEmail');
    const passInput = document.getElementById('signupPassword');
    const terms = document.getElementById('signupTerms').checked; // בודק אם ה-checkbox מסומן (true/false)

    nameInput.classList.remove('input-error');
    userInput.classList.remove('input-error');
    emailInput.classList.remove('input-error');
    passInput.classList.remove('input-error');

    let hasError = false; // דגל שבודק אם יש שגיאה באחד השדות

    //  שם מלא
    const nameErr = Auth.checkFullName(nameInput.value);
    if (nameErr !== '') 
    {
        document.getElementById('signupNameError').textContent = nameErr;
        nameInput.classList.add('input-error');
        hasError = true;
    }

    //  שם משתמש
    const userErr = Auth.checkUsername(userInput.value);
    if (userErr !== '')
    {
        document.getElementById('signupUserError').textContent = userErr;
        userInput.classList.add('input-error');
        hasError = true;
    }

    // אימייל
    const emailErr = Auth.checkEmail(emailInput.value);
    if (emailErr !== '') 
    {
        document.getElementById('signupEmailError').textContent = emailErr;
        emailInput.classList.add('input-error');
        hasError = true;
    }

    // סיסמה
    const passErr = Auth.checkPassword(passInput.value);
    if (passErr !== '')
    {
        document.getElementById('signupPassError').textContent = passErr;
        passInput.classList.add('input-error');
        hasError = true;
    }

    // אישור תנאי השימוש
    if (terms === false)
    {
        document.getElementById('signupTermsError').textContent = 'יש לאשר את תנאי השימוש כדי להירשם.';
        hasError = true;
    }

    // אם יש לפחות שגיאה אחת עוצר ולא ממשיך
    if (hasError === true)
    {
        return;
    }

    // פותח קופסה דיגיטלית ריקה (DTO)
    const userData =
     {
      fullName: nameInput.value, // שולף את הטקסט מתיבת השם הפרטי
      username: userInput.value, // שולף את הטקסט מתיבת השם משתמש
      email: emailInput.value,  // שולף את הטקסט מתיבת האימייל
      password: passInput.value // שולף את הטקסט מתיבת השם הסיסמא
    };

    // שולח את החבילה לשרת
    const response = await fetch(API_URL + '/api/register',
    {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
    });

    // מקבל את התשובה מהשרת
    const result = await response.text();
    if (result.includes('בהצלחה') || result.includes('קוד אימות'))
    {
        await Swal.fire({ 
            icon: 'success',
            text: result,
            confirmButtonText: 'מעבר לתהליך האימות',
            confirmButtonColor: '#0052cc'
        });

        // רק אחרי שהמשתמש לחץ על הכפתור בחלון, עוברים לדף האימות
        window.location.href = 'verify.html?type=register&email=' + emailInput.value;
    }
    else
    {
        Swal.fire({
            icon: 'error',
            text: result,
            confirmButtonText: 'סגירה',
            confirmButtonColor: '#0052cc'
        });
    }
};

// פונקציה שמקבלת את התשובה מגוגל אחרי שהמשתמש אישר
async function loginWithGoogle(token) 
{
    // שולחים את הטוקן לשרת שלנו כדי שירשום/יחבר את המשתמש
    const res = await fetch(API_URL + '/api/google-login', 
    {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token })
    });

    const result = await res.text(); // ממיר לטקסט מה שחזר מהשרת

    if (result.includes('בהצלחה')) 
    {
        // מפרקים את התשובה מהשרת: הודעה|שם|מייל|טוקן
        const parts = result.split('|');
        const messageText = parts[0];
        const userFullName = parts[1] || 'משתמש מחובר';
        const userEmailAddress = parts[2] || '';
        const userAuthToken = parts[3] || '';

        // שמירת הטוקן ופרטי המשתמש בדפדפן
        localStorage.setItem('authToken', userAuthToken);
        localStorage.setItem('currentUser', JSON.stringify({
            fullName: userFullName,
            email: userEmailAddress
        }));

        await Swal.fire({
            icon: 'success',
            iconColor: '#5AD64E',
            text: messageText,
            confirmButtonText: 'המשך',
            confirmButtonColor: '#0052cc'
        });

        // התחבר בהצלחה מעבירים לסביבת העבודה (דשבורד)
        window.location.href = 'dashboard.html';
    }
    else
    {
        Swal.fire({
            icon: 'error',
            text: result,
            confirmButtonText: 'סגירה',
            confirmButtonColor: '#0052cc'
        });
    }
}


// בדיקה בעת טעינת הדף 
window.onload = function() 
{
    // שחזור אימייל שמור (אם המשתמש סימן "זכור אותי" בעבר)
    const savedUser = localStorage.getItem('rememberedUser');
    if (savedUser) // אם יש ונמצא
    {
        document.getElementById('loginEmail').value = savedUser; // ממלא את השדה במייל
        document.getElementById('rememberMe').checked = true; // מסמן את התיבה זכור אותי בוי
    }

    // בודק אם חזרנו מגוגל עם טוקן
    if (window.location.hash.includes('id_token=')) 
    {
        // לוקח את כל הטקסט שאחרי "id_token="
        const parts = window.location.hash.split('id_token=');
        const token = parts[1].split('&')[0];

       // מנקה את הטוקן מסרגל הכתובות של הדפדפן
        window.history.replaceState(null, '', window.location.pathname);

        // שולח להתחברות
        loginWithGoogle(token);
    }
};

function openGoogle()
{
    const myPage = window.location.origin + window.location.pathname;
    const randomNonce = Math.random().toString(36).substring(2);

    const googleUrl = 
        'https://accounts.google.com/o/oauth2/v2/auth' +
        '?client_id=541544347287-kike3l6ru9nuroq4thre6tuvreffa8s2.apps.googleusercontent.com' +
        '&redirect_uri=' + myPage +
        '&response_type=id_token' +
        '&scope=email profile' +
        '&nonce=' + randomNonce;

    window.location.href = googleUrl; // מעביר לקישור
}
